<div class="dashboard">
  <h1>ProcureFlow Dashboard</h1>

  <p>Procurement Management System</p>

  <div class="stats">
    <div class="card">
      <h3>Purchase Requests</h3>
      <p>{{ purchaseRequests.length }}</p>
    </div>

    <div class="card">
      <h3>Quotations</h3>
      <p>{{ quotations.length }}</p>
    </div>

    <div class="card">
      <h3>Purchase Orders</h3>
      <p>{{ purchaseOrders.length }}</p>
    </div>

    <div class="card">
        <h3>Deliveries</h3>
        <p>{{ deliveries.length }}</p>
    </div>
  </div>
</div>
