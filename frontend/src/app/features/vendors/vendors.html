<div class="vendors">

  <div class="page-header">
    <div>
      <h1>Vendors</h1>
      <p>Manage procurement vendors and supplier information</p>
    </div>

    <button class="btn-primary">
      + New Vendor
    </button>
  </div>

  <div class="table-card">

    <table>

      <thead>
        <tr>
          <th>ID</th>
          <th>Vendor Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Address</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody>

        @for (vendor of vendors(); track vendor.id) {
          <tr>

            <td>#{{ vendor.id }}</td>

            <td>
              <strong>{{ vendor.name }}</strong>
            </td>

            <td>
              {{ vendor.email }}
            </td>

            <td>
              {{ vendor.phone }}
            </td>

            <td>
              {{ vendor.address }}
            </td>

            <td>
              <span
                class="status"
                [class.active]="vendor.active"
                [class.inactive]="!vendor.active">
                {{ vendor.active ? 'ACTIVE' : 'INACTIVE' }}
              </span>
            </td>

          </tr>
        }

      </tbody>

    </table>

  </div>

</div>
